
[versions]
kotlin = "2.0.0"
ksp = "2.0.0-1.0.22"
hilt = "2.51.1" # A version of Hilt compatible with Kotlin 2.0

# Other versions can remain as they are, but check for compatibility if issues persist
androidGradlePlugin = "8.5.0" # Example, ensure compatibility
# ... other versions

coreKtx = "1.13.1"
appcompat = "1.7.1"
material = "1.13.0"
activityKtx = "1.9.0"
constraint = "2.2.1"
navigation = "2.7.7"
lifecycle = "2.9.4"
viewpager = "1.1.0"
recyclerview = "1.4.0"

retrofit = "2.9.0"
okhttp = "4.11.0"

serialization = "1.7.0"
serializationConverter = "1.0.0"

fragmentKtx = "1.6.1"
datastore = "1.1.1"

junit = "4.13.2"
androidJunit = "1.3.0"
espresso = "3.7.0"
firebaseFirestoreKtx = "26.0.2"


[libraries]
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraint" }

lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }

okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "serializationConverter" }

fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }

datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidJunit" }
espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
navigationFragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigationUi = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
firebase-firestore-ktx = { group = "com.google.firebase", name = "firebase-firestore-ktx", version.ref = "firebaseFirestoreKtx" }


[plugins]

android-application = { id = "com.android.application", version = "8.9.1" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version = "2.0.0" }
protobuf = { id = "com.google.protobuf", version = "0.9.4" }
kotlinParcelize = { id = "kotlin-parcelize" }
#navigationSafeArgs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.0.0-1.0.22" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
navigationSafeArgs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }

